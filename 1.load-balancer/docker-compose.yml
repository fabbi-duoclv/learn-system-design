version: '3.8'

services:
  server1:
    image: nginx:alpine
    volumes:
      - ./html/server1:/usr/share/nginx/html:ro

  server2:
    image: nginx:alpine
    volumes:
      - ./html/server2:/usr/share/nginx/html:ro

  loadbalancer:
    image: nginx:alpine
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - server1
      - server2
